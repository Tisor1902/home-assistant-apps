name: Test and publish HA image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goon-ha-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test test/*.test.mjs
      - name: Scan code for secrets (fully redacted)
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir --redact=100 --no-banner --no-color .
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read release version
        id: version
        run: node -e 'const fs=require("node:fs"); const c=JSON.parse(fs.readFileSync("goon_calendar_sync/config.json")); if(!/^\d+\.\d+\.\d+$/.test(c.version))process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT,"tag="+c.version+"\n");'
      - uses: docker/setup-buildx-action@v3
      - name: Build audited public source
        uses: docker/build-push-action@v6
        with:
          context: goon_calendar_sync
          platforms: linux/amd64
          load: true
          push: false
          tags: goon-ha:ci
          build-args: BUILD_VERSION=${{ steps.version.outputs.tag }}
          provenance: false
      - name: Check image contains no user data or embedded credentials
        run: node scripts/check-image.mjs goon-ha:ci
      - name: Offline start, authentication, Chromium and persistence test
        run: node scripts/smoke-container.mjs goon-ha:ci
      - name: Upgrade from published HA 0.2.0 without losing configuration or calendar links
        run: |
          docker pull ghcr.io/tisor1902/goon-calendar-sync-ha:0.2.0
          node scripts/smoke-container.mjs goon-ha:ci ghcr.io/tisor1902/goon-calendar-sync-ha:0.2.0
      - name: Build optional HA login browser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: goon_google_login/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: goon-ha:ci-browser
          build-args: BUILD_VERSION=${{ steps.version.outputs.tag }}-browser
          provenance: false
      - name: Check browser image and isolated Firefox OAuth callback
        run: |
          node scripts/check-browser-image.mjs goon-ha:ci-browser
          node scripts/smoke-login-browser.mjs goon-ha:ci goon-ha:ci-browser
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both tested components
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          docker tag goon-ha:ci ghcr.io/tisor1902/goon-calendar-sync-ha:$VERSION
          docker push ghcr.io/tisor1902/goon-calendar-sync-ha:$VERSION
          docker tag goon-ha:ci-browser ghcr.io/tisor1902/goon-calendar-sync-ha:$VERSION-browser
          docker push ghcr.io/tisor1902/goon-calendar-sync-ha:$VERSION-browser
